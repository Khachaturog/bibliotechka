<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <title>Карточки — Админка Библиотечки</title>

    <link rel="stylesheet" href="https://unpkg.com/@adminkit/core@latest/dist/css/app.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
</head>

<body>
    <div class="wrapper">
        <nav id="sidebar" class="sidebar js-sidebar">
            <div class="sidebar-content js-simplebar">
                <a class="sidebar-brand" href="/admin/"><span class="align-middle">Библиотечка</span></a>
                <ul class="sidebar-nav">
                    <li class="sidebar-header">Панель</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/"><i class="align-middle" data-feather="sliders"></i> <span class="align-middle">Dashboard</span></a></li>
                    <li class="sidebar-header">Контент</li>
                    <li class="sidebar-item active"><a class="sidebar-link" href="/admin/cards.html"><i class="align-middle" data-feather="book"></i> <span class="align-middle">Карточки</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/groups.html"><i class="align-middle" data-feather="folder"></i> <span class="align-middle">Группы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/subgroups.html"><i class="align-middle" data-feather="layers"></i> <span class="align-middle">Подгруппы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/versions.html"><i class="align-middle" data-feather="git-branch"></i> <span class="align-middle">Версии</span></a></li>
                    <li class="sidebar-header">Инструменты</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/forms.html"><i class="align-middle" data-feather="edit-3"></i> <span class="align-middle">Формы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="../" target="_blank"><i class="align-middle" data-feather="external-link"></i> <span class="align-middle">На сайт</span></a></li>
                </ul>
            </div>
        </nav>

        <div class="main">
            <nav class="navbar navbar-expand navbar-light navbar-bg">
                <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
                <div class="navbar-collapse collapse">
                    <ul class="navbar-nav navbar-align">
                        <li class="nav-item"><a class="nav-link" href="../" target="_blank"><i class="align-middle" data-feather="globe"></i> <span class="align-middle d-none d-sm-inline">Сайт</span></a></li>
                    </ul>
                </div>
            </nav>

            <main class="content">
                <div class="container-fluid p-0">
                    <h1 class="h3 mb-3"><strong>Карточки</strong> материалов</h1>

                    <div class="row mb-3 align-items-end">
                        <div class="col-auto">
                            <a href="/admin/card-edit.html" class="btn btn-primary"><i class="align-middle" data-feather="plus"></i> Создать карточку</a>
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="filterSearch" class="form-control" placeholder="Поиск по названию или slug">
                        </div>
                        <div class="col-md-3">
                            <select id="filterGroup" class="form-select">
                                <option value="">Все группы</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="filterStatus" class="form-select">
                                <option value="">Все статусы</option>
                                <option value="published">Опубликовано</option>
                                <option value="draft">Черновик</option>
                            </select>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div id="cardsLoading" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 text-muted">Загрузка...</p>
                            </div>
                            <div id="cardsError" class="alert alert-danger d-none"></div>
                            <div id="cardsTableWrap" class="table-responsive d-none">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>№</th>
                                            <th>Название</th>
                                            <th>Группа</th>
                                            <th>Подгруппа</th>
                                            <th>Статус</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="cardsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="footer">
                <div class="container-fluid">
                    <div class="row text-muted">
                        <div class="col-6 text-start"><p class="mb-0"><a class="text-muted" href="https://adminkit.io/" target="_blank">AdminKit</a> · Библиотечка</p></div>
                        <div class="col-6 text-end"><a class="text-muted" href="../">На главную</a></div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://unpkg.com/@adminkit/core@latest/dist/js/app.js"></script>
    <script src="../js/config.js"></script>
    <script>
        const API_BASE = window.CONFIG?.API_BASE || '/api/v1';
        let allCards = [];
        let allGroups = [];

        async function loadGroups() {
            const res = await fetch(`${API_BASE}/groups/list`);
            if (!res.ok) throw new Error('Не удалось загрузить группы');
            allGroups = await res.json();
            const sel = document.getElementById('filterGroup');
            allGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.slug;
                opt.textContent = g.title_ru || g.slug;
                sel.appendChild(opt);
            });
        }

        async function loadCards() {
            document.getElementById('cardsLoading').classList.remove('d-none');
            document.getElementById('cardsError').classList.add('d-none');
            document.getElementById('cardsTableWrap').classList.add('d-none');

            try {
                const params = new URLSearchParams();
                const groupSlug = document.getElementById('filterGroup').value;
                const statusSlug = document.getElementById('filterStatus').value;
                if (groupSlug) params.set('group_slug', groupSlug);
                if (statusSlug) params.set('status_slug', statusSlug);

                const res = await fetch(`${API_BASE}/data/list?${params}`);
                if (!res.ok) throw new Error('Не удалось загрузить карточки');
                allCards = await res.json();

                renderCards();
                document.getElementById('cardsLoading').classList.add('d-none');
                document.getElementById('cardsTableWrap').classList.remove('d-none');
            } catch (e) {
                document.getElementById('cardsLoading').classList.add('d-none');
                document.getElementById('cardsError').textContent = e.message;
                document.getElementById('cardsError').classList.remove('d-none');
            }
        }

        function getCardNumberFromSlug(slug) {
            if (!slug) return '—';
            if (/^\d+$/.test(slug)) return slug;
            const m = slug.match(/^(\d+)-/);
            return m ? m[1] : slug;
        }

        function renderCards() {
            const tbody = document.getElementById('cardsTableBody');
            tbody.innerHTML = '';

            const q = (document.getElementById('filterSearch')?.value || '').trim().toLowerCase();
            const filtered = q
                ? allCards.filter(card => {
                    const title = (card.title || '').toLowerCase();
                    const slug = (card.slug || '').toLowerCase();
                    const desc = (card.description || '').toLowerCase();
                    return title.includes(q) || slug.includes(q) || desc.includes(q);
                })
                : allCards;

            filtered.forEach(card => {
                const tr = document.createElement('tr');
                const cardUrl = window.CONFIG?.getCardUrl(card.slug, card.url_seo_yandex) || `/card/${card.url_seo_yandex || card.slug}`;
                const editUrl = `/admin/card-edit.html?slug=${encodeURIComponent(card.slug)}`;
                const statusClass = card.status_slug === 'published' ? 'success' : (card.status_slug === 'draft' ? 'warning' : 'secondary');
                const num = getCardNumberFromSlug(card.slug);
                tr.innerHTML = `
                    <td>${num}</td>
                    <td><a href="${editUrl}">${(card.title || card.slug).replace(/</g, '&lt;')}</a></td>
                    <td>${(card.group_slug || '—').replace(/</g, '&lt;')}</td>
                    <td>${(card.subgroup_slug || '—').replace(/</g, '&lt;')}</td>
                    <td><span class="badge bg-${statusClass}">${(card.status_slug || '—').replace(/</g, '&lt;')}</span></td>
                    <td>
                        <a href="/admin/card-edit.html?slug=${encodeURIComponent(card.slug)}" class="btn btn-sm btn-outline-primary me-1">Редактировать</a>
                        <a href="${cardUrl}" target="_blank" class="btn btn-sm btn-outline-secondary">Открыть</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('filterSearch').addEventListener('input', renderCards);
        document.getElementById('filterGroup').addEventListener('change', loadCards);
        document.getElementById('filterStatus').addEventListener('change', loadCards);

        (async () => {
            try {
                await loadGroups();
                await loadCards();
            } catch (e) {
                document.getElementById('cardsLoading').classList.add('d-none');
                document.getElementById('cardsError').textContent = e.message;
                document.getElementById('cardsError').classList.remove('d-none');
            }
        })();
    </script>
</body>

</html>
