<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <title>Версия — Админка Библиотечки</title>

    <link rel="stylesheet" href="https://unpkg.com/@adminkit/core@latest/dist/css/app.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
</head>

<body>
    <div class="wrapper">
        <nav id="sidebar" class="sidebar js-sidebar">
            <div class="sidebar-content js-simplebar">
                <a class="sidebar-brand" href="/admin/"><span class="align-middle">Библиотечка</span></a>
                <ul class="sidebar-nav">
                    <li class="sidebar-header">Панель</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/"><i class="align-middle" data-feather="sliders"></i> <span class="align-middle">Dashboard</span></a></li>
                    <li class="sidebar-header">Контент</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/cards.html"><i class="align-middle" data-feather="book"></i> <span class="align-middle">Карточки</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/groups.html"><i class="align-middle" data-feather="folder"></i> <span class="align-middle">Группы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/subgroups.html"><i class="align-middle" data-feather="layers"></i> <span class="align-middle">Подгруппы</span></a></li>
                    <li class="sidebar-item active"><a class="sidebar-link" href="/admin/versions.html"><i class="align-middle" data-feather="git-branch"></i> <span class="align-middle">Версии</span></a></li>
                    <li class="sidebar-header">Инструменты</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/forms.html"><i class="align-middle" data-feather="edit-3"></i> <span class="align-middle">Формы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="../" target="_blank"><i class="align-middle" data-feather="external-link"></i> <span class="align-middle">На сайт</span></a></li>
                </ul>
            </div>
        </nav>

        <div class="main">
            <nav class="navbar navbar-expand navbar-light navbar-bg">
                <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
                <div class="navbar-collapse collapse">
                    <ul class="navbar-nav navbar-align">
                        <li class="nav-item"><a class="nav-link" href="/admin/versions.html"><i class="align-middle" data-feather="arrow-left"></i> <span class="align-middle">К версиям</span></a></li>
                    </ul>
                </div>
            </nav>

            <main class="content">
                <div class="container-fluid p-0">
                    <h1 class="h3 mb-3"><strong id="pageTitle">Создать версию</strong></h1>

                    <div id="formError" class="alert alert-danger d-none"></div>
                    <div id="formSuccess" class="alert alert-success d-none"></div>

                    <form id="versionForm" class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Slug <span class="text-danger">*</span></label>
                                        <input type="text" name="slug" id="slug" class="form-control" required placeholder="18">
                                        <small class="text-muted">Уникальный идентификатор, нельзя менять при редактировании</small>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Версия <span class="text-danger">*</span></label>
                                        <input type="text" name="version" id="version" class="form-control" required placeholder="6.2">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Название</label>
                                        <input type="text" name="title" id="title" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Описание</label>
                                        <textarea name="description" id="description" class="form-control" rows="6"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Дата релиза</label>
                                        <input type="text" name="release_date" id="release_date" class="form-control" placeholder="February 14, 2026">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">URL (ссылка)</label>
                                        <input type="url" name="url" id="url" class="form-control" placeholder="https://t.me/productorial/...">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Создано в БД</label>
                                        <input type="text" id="created_at_db" class="form-control" readonly>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Обновлено в БД</label>
                                        <input type="text" id="updated_at_db" class="form-control" readonly>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
                                <a href="/admin/versions.html" class="btn btn-outline-secondary ms-2">Отмена</a>
                            </div>
                        </div>
                    </form>
                </div>
            </main>

            <footer class="footer">
                <div class="container-fluid">
                    <div class="row text-muted">
                        <div class="col-6 text-start"><p class="mb-0"><a class="text-muted" href="https://adminkit.io/" target="_blank">AdminKit</a> · Библиотечка</p></div>
                        <div class="col-6 text-end"><a class="text-muted" href="/admin/versions.html">К версиям</a></div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://unpkg.com/@adminkit/core@latest/dist/js/app.js"></script>
    <script src="../js/config.js"></script>
    <script>
        const API_BASE = window.CONFIG?.API_BASE || '/api/v1';
        const params = new URLSearchParams(location.search);
        const slug = params.get('slug');
        const isEdit = !!slug;

        document.getElementById('pageTitle').textContent = isEdit ? 'Редактировать версию' : 'Создать версию';
        if (isEdit) document.getElementById('slug').setAttribute('readonly', true);

        const fetchOpts = { credentials: 'include' };

        const editableFields = ['slug', 'version', 'title', 'description', 'release_date', 'url'];

        async function loadVersion() {
            const res = await fetch(`${API_BASE}/versions?slug=${slug}`, fetchOpts);
            if (!res.ok) throw new Error('Версия не найдена');
            const version = await res.json();

            editableFields.forEach(f => {
                const el = document.getElementById(f);
                if (!el || version[f] == null) return;
                el.value = version[f];
            });

            if (version.created_at_db && document.getElementById('created_at_db')) {
                document.getElementById('created_at_db').value = version.created_at_db;
            }
            if (version.updated_at_db && document.getElementById('updated_at_db')) {
                document.getElementById('updated_at_db').value = version.updated_at_db;
            }
        }

        document.getElementById('versionForm').addEventListener('submit', async e => {
            e.preventDefault();
            const errEl = document.getElementById('formError');
            const okEl = document.getElementById('formSuccess');
            errEl.classList.add('d-none');
            okEl.classList.add('d-none');
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            const data = {};
            editableFields.forEach(f => {
                const el = document.getElementById(f);
                if (!el) return;
                const value = el.value;
                data[f] = value === '' ? null : value;
            });

            try {
                let res;
                if (isEdit) {
                    res = await fetch(`${API_BASE}/versions?slug=${slug}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                        credentials: 'include'
                    });
                } else {
                    res = await fetch(`${API_BASE}/versions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                        credentials: 'include'
                    });
                }
                const json = await res.json();
                if (!res.ok) {
                    throw new Error(json.error || 'Ошибка сохранения');
                }
                okEl.textContent = 'Сохранено';
                okEl.classList.remove('d-none');
                if (!isEdit) setTimeout(() => location.href = '/admin/version-edit.html?slug=' + data.slug, 1000);
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove('d-none');
            }
            btn.disabled = false;
        });

        (async () => {
            if (isEdit) await loadVersion();
        })();
    </script>
</body>

</html>
