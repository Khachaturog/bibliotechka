<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <title>Подгруппы — Админка Библиотечки</title>

    <link rel="stylesheet" href="https://unpkg.com/@adminkit/core@latest/dist/css/app.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
</head>

<body>
    <div class="wrapper">
        <nav id="sidebar" class="sidebar js-sidebar">
            <div class="sidebar-content js-simplebar">
                <a class="sidebar-brand" href="/admin/"><span class="align-middle">Библиотечка</span></a>
                <ul class="sidebar-nav">
                    <li class="sidebar-header">Панель</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/"><i class="align-middle" data-feather="sliders"></i> <span class="align-middle">Dashboard</span></a></li>
                    <li class="sidebar-header">Контент</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/cards.html"><i class="align-middle" data-feather="book"></i> <span class="align-middle">Карточки</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/groups.html"><i class="align-middle" data-feather="folder"></i> <span class="align-middle">Группы</span></a></li>
                    <li class="sidebar-item active"><a class="sidebar-link" href="/admin/subgroups.html"><i class="align-middle" data-feather="layers"></i> <span class="align-middle">Подгруппы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/versions.html"><i class="align-middle" data-feather="git-branch"></i> <span class="align-middle">Версии</span></a></li>
                    <li class="sidebar-header">Инструменты</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/forms.html"><i class="align-middle" data-feather="edit-3"></i> <span class="align-middle">Формы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="../" target="_blank"><i class="align-middle" data-feather="external-link"></i> <span class="align-middle">На сайт</span></a></li>
                </ul>
            </div>
        </nav>

        <div class="main">
            <nav class="navbar navbar-expand navbar-light navbar-bg">
                <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
                <div class="navbar-collapse collapse">
                    <ul class="navbar-nav navbar-align">
                        <li class="nav-item"><a class="nav-link" href="../" target="_blank"><i class="align-middle" data-feather="globe"></i> <span class="align-middle d-none d-sm-inline">Сайт</span></a></li>
                    </ul>
                </div>
            </nav>

            <main class="content">
                <div class="container-fluid p-0">
                    <h1 class="h3 mb-3"><strong>Подгруппы</strong></h1>

                    <div class="row mb-3 align-items-end">
                        <div class="col-auto">
                            <a href="/admin/subgroup-edit.html" class="btn btn-primary"><i class="align-middle" data-feather="plus"></i> Создать подгруппу</a>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Фильтр по группе</label>
                            <select id="filterGroup" class="form-select">
                                <option value="">Все группы</option>
                            </select>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div id="subgroupsLoading" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 text-muted">Загрузка...</p>
                            </div>
                            <div id="subgroupsError" class="alert alert-danger d-none"></div>
                            <div id="subgroupsTableWrap" class="table-responsive d-none">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Название</th>
                                            <th>Slug</th>
                                            <th>Группа</th>
                                            <th>Статус</th>
                                            <th>Порядок</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="subgroupsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="footer">
                <div class="container-fluid">
                    <div class="row text-muted">
                        <div class="col-6 text-start"><p class="mb-0"><a class="text-muted" href="https://adminkit.io/" target="_blank">AdminKit</a> · Библиотечка</p></div>
                        <div class="col-6 text-end"><a class="text-muted" href="../">На главную</a></div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://unpkg.com/@adminkit/core@latest/dist/js/app.js"></script>
    <script src="../js/config.js"></script>
    <script>
        const API_BASE = window.CONFIG?.API_BASE || '/api/v1';
        let allSubgroups = [];
        let allGroups = [];

        async function loadGroups() {
            const res = await fetch(`${API_BASE}/groups/list`);
            if (!res.ok) throw new Error('Не удалось загрузить группы');
            allGroups = await res.json();
            const sel = document.getElementById('filterGroup');
            allGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.slug;
                opt.textContent = g.title_ru || g.slug;
                sel.appendChild(opt);
            });
        }

        async function loadSubgroups() {
            document.getElementById('subgroupsLoading').classList.remove('d-none');
            document.getElementById('subgroupsError').classList.add('d-none');
            document.getElementById('subgroupsTableWrap').classList.add('d-none');

            try {
                const groupSlug = document.getElementById('filterGroup').value;
                const url = groupSlug ? `${API_BASE}/subgroups?group_slug=${groupSlug}` : `${API_BASE}/subgroups`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Не удалось загрузить подгруппы');
                allSubgroups = await res.json();
                renderSubgroups();
                document.getElementById('subgroupsLoading').classList.add('d-none');
                document.getElementById('subgroupsTableWrap').classList.remove('d-none');
            } catch (e) {
                document.getElementById('subgroupsLoading').classList.add('d-none');
                document.getElementById('subgroupsError').textContent = e.message;
                document.getElementById('subgroupsError').classList.remove('d-none');
            }
        }

        function renderSubgroups() {
            const tbody = document.getElementById('subgroupsTableBody');
            tbody.innerHTML = '';
            const groupUrl = (slug) => window.CONFIG?.getGroupUrl(slug) || `/${slug}`;

            allSubgroups.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${s.title_ru || s.slug}</td>
                    <td><code>${s.slug}</code></td>
                    <td>${s.group_slug || '—'}</td>
                    <td><span class="badge bg-secondary">${s.status || '—'}</span></td>
                    <td>${s.sort ?? '—'}</td>
                    <td>
                        <a href="/admin/subgroup-edit.html?slug=${s.slug}" class="btn btn-sm btn-outline-primary me-1">Редактировать</a>
                        <a href="${groupUrl(s.group_slug)}#${s.slug}" target="_blank" class="btn btn-sm btn-outline-secondary">Открыть</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('filterGroup').addEventListener('change', loadSubgroups);

        (async () => {
            try {
                await loadGroups();
                await loadSubgroups();
            } catch (e) {
                document.getElementById('subgroupsLoading').classList.add('d-none');
                document.getElementById('subgroupsError').textContent = e.message;
                document.getElementById('subgroupsError').classList.remove('d-none');
            }
        })();
    </script>
</body>

</html>
