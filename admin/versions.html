<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <title>Версии — Админка Библиотечки</title>

    <link rel="stylesheet" href="https://unpkg.com/@adminkit/core@latest/dist/css/app.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
</head>

<body>
    <div class="wrapper">
        <nav id="sidebar" class="sidebar js-sidebar">
            <div class="sidebar-content js-simplebar">
                <a class="sidebar-brand" href="/admin/"><span class="align-middle">Библиотечка</span></a>
                <ul class="sidebar-nav">
                    <li class="sidebar-header">Панель</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/"><i class="align-middle" data-feather="sliders"></i> <span class="align-middle">Dashboard</span></a></li>
                    <li class="sidebar-header">Контент</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/cards.html"><i class="align-middle" data-feather="book"></i> <span class="align-middle">Карточки</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/groups.html"><i class="align-middle" data-feather="folder"></i> <span class="align-middle">Группы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/subgroups.html"><i class="align-middle" data-feather="layers"></i> <span class="align-middle">Подгруппы</span></a></li>
                    <li class="sidebar-item active"><a class="sidebar-link" href="/admin/versions.html"><i class="align-middle" data-feather="git-branch"></i> <span class="align-middle">Версии</span></a></li>
                    <li class="sidebar-header">Инструменты</li>
                    <li class="sidebar-item"><a class="sidebar-link" href="/admin/forms.html"><i class="align-middle" data-feather="edit-3"></i> <span class="align-middle">Формы</span></a></li>
                    <li class="sidebar-item"><a class="sidebar-link" href="../" target="_blank"><i class="align-middle" data-feather="external-link"></i> <span class="align-middle">На сайт</span></a></li>
                </ul>
            </div>
        </nav>

        <div class="main">
            <nav class="navbar navbar-expand navbar-light navbar-bg">
                <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
                <div class="navbar-collapse collapse">
                    <ul class="navbar-nav navbar-align">
                        <li class="nav-item"><a class="nav-link" href="/about.html" target="_blank"><i class="align-middle" data-feather="info"></i> <span class="align-middle d-none d-sm-inline">О проекте</span></a></li>
                    </ul>
                </div>
            </nav>

            <main class="content">
                <div class="container-fluid p-0">
                    <h1 class="h3 mb-3"><strong>Версии</strong> / Ченджлог</h1>

                    <div class="mb-3">
                        <a href="/admin/version-edit.html" class="btn btn-primary"><i class="align-middle" data-feather="plus"></i> Создать версию</a>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div id="versionsLoading" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 text-muted">Загрузка...</p>
                            </div>
                            <div id="versionsError" class="alert alert-danger d-none"></div>
                            <div id="versionsTableWrap" class="table-responsive d-none">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Версия</th>
                                            <th>Название</th>
                                            <th>Дата релиза</th>
                                            <th>Ссылка</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="versionsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="footer">
                <div class="container-fluid">
                    <div class="row text-muted">
                        <div class="col-6 text-start"><p class="mb-0"><a class="text-muted" href="https://adminkit.io/" target="_blank">AdminKit</a> · Библиотечка</p></div>
                        <div class="col-6 text-end"><a class="text-muted" href="../">На главную</a></div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="https://unpkg.com/@adminkit/core@latest/dist/js/app.js"></script>
    <script src="../js/config.js"></script>
    <script>
        const API_BASE = window.CONFIG?.API_BASE || '/api/v1';

        (async () => {
            try {
                const res = await fetch(`${API_BASE}/versions/list`);
                if (!res.ok) throw new Error('Не удалось загрузить версии');

                const versions = await res.json();
                const tbody = document.getElementById('versionsTableBody');

                versions.forEach(v => {
                    const tr = document.createElement('tr');
                    const linkBtn = v.url
                        ? `<a href="${v.url}" target="_blank" class="btn btn-sm btn-outline-secondary me-1">Открыть</a>`
                        : '';
                    tr.innerHTML = `
                        <td><code>${v.version || v.slug}</code></td>
                        <td>${v.title || '—'}</td>
                        <td>${v.release_date || '—'}</td>
                        <td>${v.url ? '<a href="' + v.url + '" target="_blank">Ссылка</a>' : '—'}</td>
                        <td>
                            <a href="/admin/version-edit.html?slug=${v.slug}" class="btn btn-sm btn-outline-primary me-1">Редактировать</a>
                            ${linkBtn}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('versionsLoading').classList.add('d-none');
                document.getElementById('versionsTableWrap').classList.remove('d-none');
            } catch (e) {
                document.getElementById('versionsLoading').classList.add('d-none');
                document.getElementById('versionsError').textContent = e.message;
                document.getElementById('versionsError').classList.remove('d-none');
            }
        })();
    </script>
</body>

</html>
