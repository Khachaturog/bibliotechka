name: FTP Deploy to PROD

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          timeout: 600000
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/.cursor/**
            node_modules/**
            .env
            .env.*
            package.json
            package-lock.json
            requirements.txt
            docker-compose.yml
            .dockerignore
            docs/**
            scripts/**
            site_extraction/**
            database/**
            archive/**
            backups/**
            start-api.ps1
            start-api.sh
            **/*.md
            **/*.log
            .DS_Store
            cache/*.html
            **/images/covers/**
