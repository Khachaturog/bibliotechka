# FTP Deploy → Jino (legacy PHP site).
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║ CUTOVER (BIB-7) — DO NOT DISABLE YET                             ║
# ║                                                                  ║
# ║ Keep this workflow ENABLED until the user explicitly approves    ║
# ║ DNS cutover for bibliotechka.site → GitHub Pages and verifies    ║
# ║ the static site live.                                            ║
# ║                                                                  ║
# ║ After explicit OK:                                               ║
# ║   1. Disable this workflow (uncomment `if: false` below, or      ║
# ║      delete/rename this file).                                   ║
# ║   2. Leave Jino files in place 1–2 weeks as rollback.            ║
# ║   3. Then archive PHP/api/admin (see migration plan phase 5).    ║
# ║                                                                  ║
# ║ Pages workflow: .github/workflows/pages.yml                      ║
# ╚══════════════════════════════════════════════════════════════════╝
name: FTP Deploy to PROD

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    # After DNS cutover + user OK, uncomment the next line to stop FTP deploys:
    # if: false
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          timeout: 600000
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/.cursor/**
            node_modules/**
            .env
            .env.*
            package.json
            package-lock.json
            requirements.txt
            docker-compose.yml
            .dockerignore
            docs/**
            scripts/**
            site_extraction/**
            database/**
            archive/**
            backups/**
            start-api.ps1
            start-api.sh
            **/*.md
            **/*.log
            .DS_Store
            cache/*.html
            **/images/covers/**
